[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-express"
version = "0.1.0"
description = "Fabrique en deux minutes la maquette de site d'une entreprise locale, à partir de sa fiche Google."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=41",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
demo-express = "demo_express.__main__:main"

[tool.setuptools.packages.find]
include = ["demo_express*"]

[tool.setuptools.package-data]
demo_express = ["langues/*.yaml", "templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
