"Elle s'affiche sur la page « Merci » juste après votre paiement (elle commence par « DEX- »). Clé perdue ? Écrivez au support avec l'adresse e-mail de votre achat. L'activation demande une connexion à Internet.": "It is shown on the \"Thank you\" page right after your payment (it starts with \"DEX-\"). Lost your key? Email support from the address used for your purchase. Activation requires an internet connection."
"La clé est vérifiée en ligne au démarrage puis une fois par jour. Seuls la clé et un identifiant anonyme de cet ordinateur sont envoyés au serveur de licences. Sans Internet, l'application reste utilisable {jours} jours après la dernière vérification réussie. Licence valable sur 2 ordinateurs. En cas de remboursement, la licence est désactivée.": "The key is checked online at startup and then once a day. Only the key and an anonymous identifier of this computer are sent to the licence server. Without internet, the app stays usable for {jours} days after the last successful check. Licence valid on 2 computers. If refunded, the licence is deactivated."
